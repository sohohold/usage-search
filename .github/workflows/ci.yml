name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 短いクエリ（1〜2文字）のテストは実物の Elasticsearch に対して走らせる。
    # 起動していない環境ではテスト側が自動でスキップする。
    services:
      elasticsearch:
        image: elasticsearch:9.5.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          ELASTICSEARCH_URL: http://localhost:9200

      - name: Build
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      elasticsearch:
        image: elasticsearch:9.5.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Index a small subset of Aozora Bunko (50 works)
      - name: Build index (50 works)
        run: npx tsx scripts/build-index.ts --limit 50
        env:
          DB_PATH: ./data/aozora.db
          DATA_DIR: ./data

      - name: Verify database exists
        run: |
          ls -lh data/aozora.db
          echo "--- DB stats ---"
          sqlite3 data/aozora.db "SELECT count(*) || ' works' FROM works; SELECT count(*) || ' chunks' FROM chunks;"

      # The unit tests cover this on fixtures; here it is checked against real
      # downloaded texts, where the markup and legend blocks actually come from.
      - name: Verify indexed text is free of Aozora markup
        run: |
          RESIDUE=$(sqlite3 data/aozora.db \
            "SELECT count(*) FROM chunks WHERE text LIKE '%［＃%' OR text LIKE '%《%' OR text LIKE '%テキスト中に現れる記号について%';")
          echo "chunks containing markup or legend text: $RESIDUE"
          [ "$RESIDUE" = "0" ] || exit 1

      # Start Next.js dev server using local SQLite via libsql file: URL
      - name: Start server
        run: npm run dev &
        env:
          TURSO_DATABASE_URL: file:./data/aozora.db
          PORT: "3000"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/stats > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Test /api/stats
        run: |
          STATS=$(curl -sf http://localhost:3000/api/stats)
          echo "$STATS"
          echo "$STATS" | jq -e '.works > 0 and .chunks > 0'

      - name: Test /api/search
        run: |
          # Search for a common word (trigram FTS5 requires 3+ chars)
          RESULT=$(curl -sf "http://localhost:3000/api/search?q=%E3%81%AE%E4%B8%AD%E3%81%AB&limit=5")
          echo "$RESULT" | jq .
          echo "$RESULT" | jq -e '.results | length > 0'
          # The author link comes from the catalog's person ID, so it only shows up
          # once a real index has been built.
          echo "$RESULT" | jq -e '[.results[].author_url | select(startswith("https://www.aozora.gr.jp/index_pages/person"))] | length > 0'

      - name: Test short query rejection
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/api/search?q=ab")
          [ "$STATUS" = "400" ] && echo "Correctly rejected 2-char query" || exit 1

      # ここからは Elasticsearch バックエンド。同じ SQLite の索引を ES に載せ替え、
      # 1〜2文字が実際に引けることを通しで確認する。
      - name: Load index into Elasticsearch
        run: npm run index:es
        env:
          DB_PATH: ./data/aozora.db
          ELASTICSEARCH_URL: http://localhost:9200

      - name: Start server (Elasticsearch backend)
        run: npm run dev &
        env:
          SEARCH_BACKEND: elasticsearch
          ELASTICSEARCH_URL: http://localhost:9200
          NEXT_PUBLIC_MIN_QUERY_LENGTH: "1"
          PORT: "3001"

      - name: Wait for server (Elasticsearch backend)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/stats > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Test 1-2 character search (Elasticsearch)
        run: |
          for Q in %E6%9C%88 %E6%9C%88%E3%81%8C %E3%81%AE%E4%B8%AD%E3%81%AB; do
            RESULT=$(curl -sf "http://localhost:3001/api/search?q=$Q&limit=5")
            echo "$RESULT" | jq -e '.results | length > 0'
            echo "$RESULT" | jq -e '[.results[].snippet | select(contains("<mark>"))] | length > 0'
          done
          STATS=$(curl -sf http://localhost:3001/api/stats)
          echo "$STATS" | jq -e '.works > 0 and .chunks > 0'
          # 空クエリだけは変わらず 400。
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3001/api/search?q=")
          [ "$STATUS" = "400" ] || exit 1
